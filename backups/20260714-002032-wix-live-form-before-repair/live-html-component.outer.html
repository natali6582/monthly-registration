<html lang="he" dir="rtl"><head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;800&amp;display=swap" rel="stylesheet">

  <style>
    :root {
      color-scheme: light;
      --bg-main: #f2f2f2;
      --bg-card: #ffffff;
      --color-green: #a9d18e;
      --color-blue: #9dc3e6;
      --text-dark: #333333;
      --text-light: #777777;
      --focus: rgba(157, 195, 230, .24);
      --shadow: 0 10px 30px rgba(157, 195, 230, .2);
      font-family: "Heebo", Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: inherit;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: var(--text-dark);
      background: transparent;
    }

    .registration-card {
      width: 100%;
      max-width: 850px;
      overflow: hidden;
      border-radius: 20px;
      background: var(--bg-card);
      box-shadow: var(--shadow);
      animation: slideUpFade .6s ease-out forwards;
    }

    @keyframes slideUpFade {
      from {
        opacity: 0;
        transform: translateY(30px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .card-header {
      position: relative;
      display: flex;
      min-height: 155px;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 30px;
      text-align: center;
      color: #ffffff;
      background: linear-gradient(135deg, var(--color-blue), var(--color-green));
    }

    .company-logo {
      position: absolute;
      top: 20px;
      left: 20px;
      width: auto;
      max-width: 160px;
      max-height: 50px;
      filter: drop-shadow(0 4px 6px rgba(0, 0, 0, .1));
      transition: transform .3s ease;
    }

    .company-logo:hover {
      transform: scale(1.05);
    }

    .card-header h1 {
      margin-bottom: 10px;
      font-size: 28px;
      font-weight: 700;
      line-height: 1.25;
      letter-spacing: 0;
      text-shadow: 0 2px 4px rgba(0, 0, 0, .1);
    }

    .card-header p {
      max-width: 560px;
      font-size: 16px;
      font-weight: 400;
      line-height: 1.55;
      opacity: .95;
    }

    .card-body {
      padding: 40px 30px;
    }

    form {
      display: grid;
      gap: 30px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 25px;
    }

    .full-width {
      grid-column: 1 / -1;
    }

    .input-group {
      position: relative;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .input-group input,
    .input-group textarea {
      width: 100%;
      padding: 15px 15px 10px;
      border: 2px solid var(--bg-main);
      border-radius: 10px;
      outline: none;
      background-color: transparent;
      color: var(--text-dark);
      font: inherit;
      font-size: 16px;
      transition: border-color .3s ease, box-shadow .3s ease;
    }

    .input-group input {
      min-height: 52px;
    }

    .input-group textarea {
      min-height: 120px;
      resize: vertical;
    }

    .input-group label {
      position: absolute;
      top: 50%;
      right: 15px;
      padding: 0 5px;
      color: var(--text-light);
      background-color: var(--bg-card);
      font-size: 16px;
      pointer-events: none;
      transform: translateY(-50%);
      transition: top .3s ease, color .3s ease, font-size .3s ease, font-weight .3s ease;
    }

    .textarea-group label {
      top: 25px;
    }

    .input-group input:focus,
    .input-group input:not(:placeholder-shown),
    .input-group textarea:focus,
    .input-group textarea:not(:placeholder-shown) {
      border-color: var(--color-blue);
      box-shadow: 0 0 0 3px var(--focus);
    }

    .input-group input:focus + label,
    .input-group input:not(:placeholder-shown) + label,
    .input-group textarea:focus + label,
    .input-group textarea:not(:placeholder-shown) + label {
      top: 0;
      color: var(--color-blue);
      font-size: 12px;
      font-weight: 500;
    }

    .focus-section {
      display: flex;
      flex-direction: column;
    }

    .focus-section h2 {
      margin-bottom: 15px;
      color: var(--text-dark);
      font-size: 16px;
      font-weight: 500;
      line-height: 1.45;
      letter-spacing: 0;
    }

    .status {
      min-height: 18px;
      color: #66964e;
      font-size: 14px;
      font-weight: 700;
      line-height: 1.35;
    }

    .submit-btn {
      display: flex;
      width: 100%;
      min-height: 56px;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 16px;
      border: 0;
      border-radius: 10px;
      color: var(--bg-card);
      background-color: var(--color-blue);
      box-shadow: 0 4px 15px rgba(157, 195, 230, .4);
      font: inherit;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      transition: background-color .3s ease, box-shadow .3s ease, opacity .3s ease, transform .3s ease;
    }

    .submit-btn:hover {
      background-color: var(--color-green);
      box-shadow: 0 6px 20px rgba(169, 209, 142, .5);
      transform: translateY(-2px);
    }

    .submit-btn:active {
      transform: translateY(0);
    }

    .submit-btn:disabled {
      cursor: wait;
      opacity: .7;
      transform: none;
    }

    @media (max-width: 768px) {
      body {
        align-items: flex-start;
        padding: 14px;
      }

      .registration-card {
        max-width: 600px;
      }

      .card-header {
        min-height: 150px;
        padding: 36px 22px 30px;
      }

      .company-logo {
        top: 15px;
        left: 15px;
        max-width: 125px;
        max-height: 40px;
      }

      .card-header h1 {
        margin-top: 24px;
      }

      .card-body {
        padding: 30px 22px;
      }

      .form-grid {
        grid-template-columns: 1fr;
        gap: 20px;
      }
    }

    @media (max-width: 420px) {
      .card-header {
        align-items: stretch;
        text-align: center;
      }

      .company-logo {
        position: static;
        align-self: flex-start;
        margin-bottom: 16px;
      }

      .card-header h1 {
        margin-top: 0;
        font-size: 24px;
      }
    }
  </style>
</head>
<body>
  <div class="registration-card" id="mainCard">
    <header class="card-header">
      <img class="company-logo" src="https://static.wixstatic.com/media/88ee62_e49e0105bfab4767ab7be2bfcbcaf211~mv2.png/v1/fill/w_290,h_103,al_c,q_85,usm_0.66_1.00_0.01,enc_avif,quality_auto/impactLogo_impact_horizontal_pos-removebg-preview.png" alt="Plan-T Smart Financial Platform">
      <h1>הרשמה להדרכה</h1>
      <p>מלאו פרטים ונחזור אליכם עם פרטי ההדרכה הקרובה.</p>
    </header>

    <main class="card-body" id="formBody">
      <form id="registrationForm" novalidate="">
        <div class="form-grid">
          <div class="input-group">
            <input type="text" id="fullName" name="name" autocomplete="name" required="" placeholder=" ">
            <label for="fullName">שם מלא</label>
          </div>

          <div class="input-group">
            <input type="text" id="role" name="role" autocomplete="organization-title" required="" placeholder=" ">
            <label for="role">תפקיד</label>
          </div>

          <div class="input-group">
            <input type="text" id="company" name="company" autocomplete="organization" required="" placeholder=" ">
            <label for="company">חברה / שם משרד</label>
          </div>

          <div class="input-group">
            <input type="tel" id="phone" name="phone" autocomplete="tel" required="" placeholder=" ">
            <label for="phone">טלפון</label>
          </div>

          <div class="input-group full-width">
            <input type="email" id="email" name="email" autocomplete="email" required="" placeholder=" ">
            <label for="email">אימייל</label>
          </div>

          <section class="focus-section full-width" aria-labelledby="focusTitle">
            <h2 id="focusTitle">מתוך נושא ההדרכה הנוכחי, מה היית רוצה לחדד?</h2>
            <div class="input-group textarea-group">
              <textarea id="trainingFocus" name="training_focus" required="" placeholder=" "></textarea>
              <label for="trainingFocus">נושאים, שאלות, נקודות לחידוד...</label>
            </div>
          </section>
        </div>

        <div class="status" id="status" aria-live="polite">ההרשמה נשלחה.</div>

        <button id="submitButton" class="submit-btn" type="submit">
          שליחת הרשמה
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </form>
    </main>
  </div>

  <script>
    const form = document.getElementById('registrationForm');
    const statusBox = document.getElementById('status');
    const submitButton = document.getElementById('submitButton');
    const fixedTopicValue = 'נושא ההדרכה נקבע על ידי החברה';

    function setSending(isSending) {
      submitButton.disabled = isSending;
      statusBox.textContent = isSending ? 'שולח...' : '';
    }

    form.addEventListener('submit', (event) => {
      event.preventDefault();

      if (!form.reportValidity()) {
        return;
      }

      const payload = {
        name: form.elements.name.value,
        role: form.elements.role.value,
        company: form.elements.company.value,
        email: form.elements.email.value,
        phone: form.elements.phone.value,
        training_focus: form.elements.training_focus.value,
        selected_topics: fixedTopicValue
      };

      setSending(true);
      window.parent.postMessage({
        type: 'plan-t-registration-submit',
        payload
      }, '*');
    });

    window.addEventListener('message', (event) => {
      const message = event.data || {};

      if (message.type !== 'plan-t-registration-status') {
        return;
      }

      if (message.status === 'sending') {
        setSending(true);
        return;
      }

      setSending(false);

      if (message.status === 'success') {
        form.reset();
        statusBox.textContent = 'ההרשמה נשלחה.';
        return;
      }

      statusBox.textContent = message.message || 'ההרשמה לא נשלחה. נסו שוב.';
    });
  </script>


</body></html>
